name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment Variables
        run: |
          echo "Owner=${RepoOwner,,}" >> $GITHUB_ENV
          ShortSHA=$(git rev-parse --short=7 HEAD)
          echo "VersionTag=$ShortSHA" >> $GITHUB_ENV
        env:
          RepoOwner: "${{ github.repository_owner }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.Owner }}/ifluxo:${{ env.VersionTag }}
            ghcr.io/${{ env.Owner }}/ifluxo:latest
